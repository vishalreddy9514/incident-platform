# Self-hosted Prometheus (Phase 1 §13: CloudWatch for base infra metrics,
# Prometheus/Grafana layered on top for the richer application dashboards -
# avoids the cost of AWS Managed Prometheus/Grafana for a portfolio project).
# Scrapes the backend's Actuator endpoint and the AI service's instrumentator
# endpoint directly - both already unauthenticated for exactly this reason
# (see SecurityConfig.java / app/main.py).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
