[project]
name = "incident-platform-ai-service"
version = "0.1.0"
description = "FastAPI AI analysis microservice for the Incident & Support Management Platform"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort (import sorting)
  "UP",  # pyupgrade
  "B",   # bugbear (common bug patterns)
  "SIM", # simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern (Depends(...) as an argument default)
# is idiomatic, not the mutable-default-argument bug B008 otherwise catches.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Reporting only, no minimum-ratio gate - matches the backend's JaCoCo setup and the project's
# "meaningful coverage, not a percentage chased for its own sake" stance (Phase 1 section 11).
show_missing = true
