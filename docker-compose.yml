# Local development environment.
#
# At Phase 2, only the infrastructure dependencies (Postgres, Redis) are
# runnable — there is no application code yet. Run `docker compose up postgres redis`
# to confirm the environment works. The backend/ai-service/frontend blocks
# below are wired up but commented out; they are enabled in the phases that
# introduce each service's Dockerfile (backend: Phase 10, ai-service: Phase 10,
# frontend: Phase 10), rather than left as fake/placeholder services.

services:
  postgres:
    image: postgres:16-alpine
    container_name: incident-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_platform}
      POSTGRES_USER: ${POSTGRES_USER:-incident_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incident_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: incident-platform-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

