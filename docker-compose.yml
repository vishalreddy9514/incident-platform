# Local development environment. `docker compose up --build` runs the whole
# stack (Postgres, Redis, backend, ai-service, frontend); `docker compose up
# postgres redis` alone is still useful for running the backend/ai-service
# outside Docker against containerised infra (see README's per-service
# "Running locally" sections).

services:
  postgres:
    image: postgres:16-alpine
    container_name: incident-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_platform}
      POSTGRES_USER: ${POSTGRES_USER:-incident_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incident_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: incident-platform-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: incident-platform-backend
    env_file: .env
    environment:
      # Overrides application.yml's `localhost` default (correct for
      # `mvn spring-boot:run`, wrong once the backend is itself a container)
      # to the compose service names below, which its own internal DNS
      # resolves — .env's POSTGRES_HOST/REDIS_HOST default to these already,
      # but pinning them here means this file is correct even if someone
      # changes those defaults for a non-Docker workflow.
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
    container_name: incident-platform-ai-service
    env_file: .env
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/v1/health')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: incident-platform-frontend
    env_file: .env
    environment:
      # Backend's origin (scheme+host+port, no path) for the CSP connect-src
      # nginx.conf.template sets - must match VITE_API_BASE_URL's origin, since
      # the frontend is a different origin from the backend here (different
      # ports), unlike behind the single ALB infrastructure/terraform provisions.
      API_ORIGIN: ${FRONTEND_CSP_CONNECT_SRC:-http://localhost:8080}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

  # --- Observability (Phase 14) ---
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: incident-platform-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    container_name: incident-platform-grafana
    environment:
      # Dev-only default (Phase 14 has no real users/auth story of its own) -
      # change before ever exposing this beyond localhost.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-locally}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
