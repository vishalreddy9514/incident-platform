name: PR verification

# Runs on every pull request against main, and is also reusable
# (workflow_call) so deploy.yml can re-run the exact same verification on
# main itself before building/pushing images (ADR-0005: "re-run build,
# don't trust PR artifacts blindly").
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Lint/format check (Spotless)
        working-directory: backend
        run: mvn -B spotless:check

      - name: Unit, slice, and integration tests
        working-directory: backend
        # Testcontainers-backed tests (AuthenticationIntegrationTest,
        # IncidentManagementIntegrationTest, FlywayMigrationTest,
        # IncidentCategoryRepositoryTest, IncidentPlatformApplicationTests)
        # run for real here — ubuntu-latest has a Docker daemon with
        # registry access, unlike some restricted local dev sandboxes.
        run: mvn -B test

      - name: Coverage report (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Dependency vulnerability scan (OWASP)
        working-directory: backend
        # Non-blocking and time-boxed: without an NVD_API_KEY secret (not
        # configured yet - see docs/security.md), the NVD feed is heavily
        # rate-limited - confirmed in practice taking 10+ minutes just to
        # download the CVE feed on a cold cache. continue-on-error means a
        # real finding or a timeout alike never blocks the job; real
        # findings are still visible in the step's own log either way.
        #
        # The step's own `timeout-minutes` is a backstop, not the primary
        # cutoff: observed in practice (two consecutive real runs) not to
        # reliably force-terminate a step that's blocked in a slow/hanging
        # network read within its window - the shell-level `timeout` below
        # sends the kill signal directly to the Maven process itself
        # instead of relying on the runner to do it.
        continue-on-error: true
        timeout-minutes: 10
        run: timeout 7m mvn -B org.owasp:dependency-check-maven:12.1.1:check -DfailBuildOnCVSS=8

  ai-service:
    name: AI service (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Lint/format check
        working-directory: ai-service
        run: |
          ruff check .
          black --check .

      - name: Type check
        working-directory: ai-service
        run: mypy app

      - name: Tests with coverage
        working-directory: ai-service
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Dependency vulnerability scan (pip-audit)
        working-directory: ai-service
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint/format check
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check

      - name: Type check and build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1
        run: npm run build

      - name: Tests with coverage
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1
        run: npm run test:coverage

      - name: Dependency vulnerability scan (npm audit)
        working-directory: frontend
        # Non-blocking: npm audit surfaces plenty of transitive
        # low/moderate findings unrelated to code this project controls;
        # real high/critical findings are still visible in the log.
        continue-on-error: true
        run: npm audit --audit-level=high

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, ai-service, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          tags: incident-platform-${{ matrix.service }}:pr-check

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive infrastructure/terraform

      # No real AWS account/credentials exist yet (Phase 13), so this can
      # only go as far as `validate` - real API calls (a `plan`, which
      # would also require exactly one of a pre-existing S3 state bucket or
      # a throwaway one) are out of scope here. `-backend=false` skips the
      # backend entirely, which is all `validate` needs; module resolution
      # covers every modules/* directory transitively through these two
      # root configurations.
      - name: Validate bootstrap config
        working-directory: infrastructure/terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate dev environment config
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

  # Everything else known to be part of the originally-planned pipeline
  # (Phase 1 §12) but not yet real:
  # - Static analysis (SonarQube/SonarCloud) - needs an external SonarCloud
  #   project + SONAR_TOKEN secret that don't exist yet.
  # - Playwright E2E against a Docker Compose stack - tests/e2e has no
  #   actual test files yet (see its README), only a description of what
  #   it will eventually cover.
  # Both are documented gaps (docs/testing.md), not silently-skipped steps.
