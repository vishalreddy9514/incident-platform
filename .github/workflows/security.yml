name: Security scanning

# Separate from pr.yml/deploy.yml (ADR-0005's two-pipeline split) - this
# workflow's job is finding problems, not verifying or deploying, and it
# needs `security-events: write` (to publish CodeQL results) that neither of
# those two should ever carry. Runs on every PR against main and weekly on
# main itself, so drift (a newly-disclosed CodeQL query, a secret that
# slipped through review) gets caught even between PRs.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Downloaded directly by coordinates rather than a marketplace action -
      # gitleaks itself is fully open source (MIT) with no license gate; the
      # popular gitleaks-action wrapper adds one for GitHub-organisation-owned
      # private repos, which this download sidesteps entirely (same "fetch
      # the binary directly" pattern as actionlint/terraform in Phase 11/12).
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # --no-git: scans the checked-out working tree, not full commit
      # history - catches anything present right now (what a blocking PR
      # check should gate on), not a one-time deep-history audit.
      - name: Scan for committed secrets
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --verbose

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Only java-kotlin needs an explicit build (CodeQL traces compilation
      # to resolve types) - python/javascript-typescript are analysed
      # without a build step (build-mode: none).
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend
        if: matrix.language == 'java-kotlin'
        working-directory: backend
        run: mvn -B -DskipTests -Dspotless.check.skip=true compile

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  iac-scan:
    name: IaC misconfiguration scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Trivy already used for image scanning in deploy.yml, pointed at
      # `scan-type: config` instead - checks the Terraform itself (Phase 12)
      # for misconfigurations (e.g. an unencrypted resource, an over-broad
      # security group), not the images built from it. Blocking on
      # HIGH/CRITICAL, matching deploy.yml's image-scan precedent.
      - uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
