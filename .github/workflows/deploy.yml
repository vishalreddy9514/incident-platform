name: Deploy

# Runs only on merge to main (ADR-0005) — this workflow, and only this one,
# ever has package-write access; pr.yml never does. Steps 1-3 of the
# originally-planned pipeline (Phase 1 §12: re-run build, build images, scan
# and block on high/critical CVEs) are real today. Steps 4-7 (push to ECR,
# terraform plan/apply, deploy to ECS, smoke test) need infrastructure that
# doesn't exist yet — Terraform is Phase 12, cloud deployment is Phase 13 —
# so this workflow pushes to GHCR for now rather than faking an ECR push
# with secrets that were never configured. See ADR-0012.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Re-run verification
    uses: ./.github/workflows/pr.yml

  build-scan-push:
    name: Build, scan, and push images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Without this, the first service whose scan fails cancels the other
      # two mid-build, so a run reports one finding and hides whatever the
      # other images would have said. For a security gate that is the wrong
      # trade: one run should report every image's findings at once.
      fail-fast: false
      matrix:
        service: [backend, ai-service, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}:latest

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}:latest

  deployment-status:
    name: Deployment status
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "### Images pushed to GHCR" >> "$GITHUB_STEP_SUMMARY"
          echo "- backend, ai-service, frontend @ \`${{ github.sha }}\` and \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Not yet part of this pipeline** (Phase 12/13): terraform plan/apply, ECS task definition update, smoke tests against a deployed environment. See ADR-0012." >> "$GITHUB_STEP_SUMMARY"
