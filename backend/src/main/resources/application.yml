spring:
  application:
    name: incident-platform-backend

  datasource:
    # POSTGRES_HOST defaults to localhost for `mvn spring-boot:run` against
    # `docker compose up postgres redis`; docker-compose.yml overrides it to
    # the "postgres" service name when the backend itself runs as a container.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:incident_platform}
    username: ${POSTGRES_USER:incident_platform}
    password: ${POSTGRES_PASSWORD:change-me-locally}

  jpa:
    hibernate:
      ddl-auto: validate  # schema is owned by Flyway migrations, not Hibernate auto-DDL
    open-in-view: false
    properties:
      hibernate:
        # Entity associations stay LAZY by design (Incident.java's javadoc); this batches the
        # otherwise-N+1 lookups for a page of incidents' category/creator/assignee/team into a
        # handful of IN-clause queries instead of one query per row per association.
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-bytes-for-hs256}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  rate-limit:
    auth:
      max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:5}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    internal-token: ${AI_SERVICE_INTERNAL_TOKEN:change-me-in-env}
  admin-bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
